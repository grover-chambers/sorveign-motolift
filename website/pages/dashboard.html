<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Dashboard — SOrvReign MotoLift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header id="global-header"></header>

  <section>
    <span class="section-label">Dashboard</span>
    <h2>Rider Dashboard</h2>
    <p class="section-sub">Track your balance, earnings, and progress toward ownership.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:2rem">
      <div class="card"><h3>Remaining Balance</h3><p style="font-size:1.8rem;font-weight:700;color:var(--text);margin-top:8px">KES 95,000</p></div>
      <div class="card"><h3>Total Earnings</h3><p style="font-size:1.8rem;font-weight:700;color:var(--text);margin-top:8px">KES 34,500</p></div>
      <div class="card"><h3>Daily Target</h3><p style="font-size:1.8rem;font-weight:700;color:var(--text);margin-top:8px">KES 350</p></div>
      <div class="card"><h3>Progress</h3><p style="font-size:1.8rem;font-weight:700;color:var(--green);margin-top:8px">65%</p></div>
    </div>
  </section>

  <footer id="global-footer"></footer>
  <script src="../js/components.js"></script>
</body>
</html>
