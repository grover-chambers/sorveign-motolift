<head>

  <link rel="stylesheet" href="../style.css">
  <style>
    .detail-hero { position: relative; padding: 0; background: #061018; }

    .carousel-container { position: relative; width: 100%; max-width: 900px; margin: 0 auto; overflow: hidden; }
    .carousel-track { display: flex; transition: transform 0.4s ease; }
    .carousel-slide { min-width: 100%; aspect-ratio: 16/10; }
    .carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); z-index: 10;
      background: rgba(0,0,0,0.45); color: #fff; border: none; width: 44px; height: 44px;
      border-radius: 50%; cursor: pointer; font-size: 1.3rem; display: flex; align-items: center;
      justify-content: center; transition: background 0.2s; }
    .carousel-btn:hover { background: rgba(0,0,0,0.7); }
    .carousel-prev { left: 16px; }
    .carousel-next { right: 16px; }

    .carousel-dots { display: flex; justify-content: center; gap: 8px; padding: 12px 0; background: #061018; }
    .carousel-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.25);
      border: none; cursor: pointer; transition: background 0.2s; }
    .carousel-dot.active { background: var(--green); }

    .detail-badge { display: inline-block; padding: 4px 14px; border-radius: 99px; font-size: 0.75rem;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-badge.electric { background: var(--green-light); color: var(--green); }
    .detail-badge.petrol { background: #fff3e0; color: #e65100; }

    .detail-section { max-width: 900px; margin: 0 auto; padding: 48px 24px; }
    .detail-section h2 { font-family: var(--font-heading); font-size: 1.6rem; margin-bottom: 24px; }

    .detail-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .detail-header h1 { font-family: var(--font-heading); font-size: 2rem; }
    .detail-sub { color: var(--text-muted); font-size: 1rem; margin-top: 4px; }

    .specs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 24px; }
    .spec-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; }
    .spec-card .spec-icon { font-size: 1.5rem; margin-bottom: 8px; }
    .spec-card .spec-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
    .spec-card .spec-value { font-size: 1.1rem; font-weight: 700; }
    .spec-card .spec-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    .spec-table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    .spec-table tr { border-bottom: 1px solid var(--border); }
    .spec-table td { padding: 14px 8px; font-size: 0.9rem; }
    .spec-table td:first-child { font-weight: 600; color: var(--text-muted); width: 200px; }

    .detail-cta { text-align: center; padding: 64px 24px; background: #061018; color: #fff; }
    .detail-cta h2 { font-family: var(--font-heading); font-size: 1.8rem; margin-bottom: 8px; }
    .detail-cta p { color: rgba(255,255,255,0.6); margin-bottom: 24px; }

    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--green); text-decoration: none;
      font-weight: 600; font-size: 0.85rem; margin-bottom: 16px; }
    .back-link:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      .specs-grid { grid-template-columns: 1fr 1fr; }
      .detail-section { padding: 32px 16px; }
      .detail-header h1 { font-size: 1.5rem; }
      .carousel-btn { width: 36px; height: 36px; font-size: 1rem; }
    }
  </style>
</head>

          { icon: '⚖️', label: 'Payload', value: '200 kg', sub: 'Reinforced frame' },
          { icon: '🔧', label: 'Service Interval', value: 'Every 3,000 km', sub: 'Heavy-duty parts' },
        ],
        fullSpecs: [
          ['Engine Type', '4-stroke, air-cooled, single cylinder'],
          ['Displacement', '149.5 cc'],
          ['Max Power', '11.5 HP @ 7,500 rpm'],
          ['Max Torque', '12.5 N·m @ 5,500 rpm'],
          ['Fuel System', 'Carburetor (CV type)'],
          ['Fuel Tank Capacity', '14 L (2 L reserve)'],
          ['Mileage (City)', '35–40 km/L'],
          ['Mileage (Highway)', '40–45 km/L'],
          ['Top Speed', '100 km/h'],
          ['Transmission', '5-speed manual (1-down, 4-up)'],
          ['Clutch', 'Wet, multi-plate'],
          ['Starting', 'Electric + kick start'],
          ['Brakes', 'Front disc / Rear drum'],
          ['Tyre Size', 'Front 90/90-18 / Rear 110/90-18'],
          ['Suspension', 'Front telescopic / Rear dual adjustable shock'],
          ['Ground Clearance', '170 mm'],
          ['Seat Height', '800 mm'],
          ['Kerb Weight', '125 kg'],
          ['Max Payload', '200 kg'],
          ['Oil Capacity', '1.2 L'],
          ['Service Interval', 'Every 3,000 km'],
        ],
      },
    };

    var params = new URLSearchParams(window.location.search);
    var bikeKey = params.get('bike') || 'spiro';
    var bike = bikes[bikeKey];

    if (!bike) {
      document.getElementById('bikeDetailApp').innerHTML = '<div style="text-align:center;padding:80px 24px"><h2>Motorcycle not found</h2><p style="color:var(--text-muted);margin-top:8px"><a href="marketplace.html">Browse all motorcycles</a></p></div>';
    } else {
      document.title = bike.name + ' — SOrvReign MotoLift';
      document.getElementById('bikeName').textContent = bike.name;
      document.getElementById('bikeSub').textContent = bike.tag;
      document.getElementById('bikeDesc').textContent = bike.desc;
      document.getElementById('bikeWhy').textContent = bike.why;
      document.getElementById('bikeBadge').textContent = bike.type.charAt(0).toUpperCase() + bike.type.slice(1);
      document.getElementById('bikeBadge').className = 'detail-badge ' + bike.type;
      document.getElementById('applyBtn').href = 'apply.html?bike=' + bikeKey;

      // Highlights
      var highlightsEl = document.getElementById('bikeHighlights');
      bike.highlights.forEach(function (h) {
        var li = document.createElement('li');
        li.innerHTML = '<span style="color:var(--green);margin-right:8px">✓</span>' + h;
        li.style.cssText = 'padding:8px 12px;background:var(--card);border-radius:8px;border:1px solid var(--border);font-size:0.9rem;';
        highlightsEl.appendChild(li);
      });

      // Spec cards
      var specsGrid = document.getElementById('specsGrid');
      bike.specs.forEach(function (s) {
        var div = document.createElement('div');
        div.className = 'spec-card';
        div.innerHTML = '<div class="spec-icon">' + s.icon + '</div><div class="spec-label">' + s.label + '</div><div class="spec-value">' + s.value + '</div><div class="spec-sub">' + s.sub + '</div>';
        specsGrid.appendChild(div);
      });

      // Full spec table
      var table = document.getElementById('fullSpecsTable');
      bike.fullSpecs.forEach(function (row) {
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + row[0] + '</td><td>' + row[1] + '</td>';
        table.appendChild(tr);
      });

      // Carousel
      var track = document.getElementById('carouselTrack');
      var dots = document.getElementById('carouselDots');
      var current = 0;

      bike.images.forEach(function (src, i) {
        var slide = document.createElement('div');
        slide.className = 'carousel-slide';
        var img = document.createElement('img');
        img.src = src;
        img.alt = bike.name + ' image ' + (i + 1);
        img.onerror = function () { this.parentElement.style.display = 'none'; };
        slide.appendChild(img);
        track.appendChild(slide);

        var dot = document.createElement('button');
        dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
        dot.setAttribute('data-index', i);
        dot.addEventListener('click', function () { goTo(parseInt(this.getAttribute('data-index'))); });
        dots.appendChild(dot);
      });

      var totalSlides = bike.images.length;

      function goTo(index) {
        current = index;
        track.style.transform = 'translateX(-' + (current * 100) + '%)';
        document.querySelectorAll('.carousel-dot').forEach(function (d, i) {
          d.classList.toggle('active', i === current);
        });
      }

      document.getElementById('prevBtn').addEventListener('click', function () {
        goTo((current - 1 + totalSlides) % totalSlides);
      });
      document.getElementById('nextBtn').addEventListener('click', function () {
        goTo((current + 1) % totalSlides);
      });

      // Touch swipe
      var startX = 0;
      var carousel = document.getElementById('carousel');
      carousel.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; });
      carousel.addEventListener('touchend', function (e) {
        var diff = startX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 50) {
          diff > 0 ? goTo((current + 1) % totalSlides) : goTo((current - 1 + totalSlides) % totalSlides);
        }
      });
    }
  </script>
</body>
</html>
